<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo de resíduo - Volta</title>
    <link rel="icon" href="../assets/img/content/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alata&family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
</head>
<body>

    <nav class="nav">
      <div class="menu">
        <input type="checkbox" id="menu-toggle" />

        <div class="nav-logo">
          <a href="../painel.html">
            <img src="../assets/img/content/Logo_VOLTA_branco.png" alt="VOLTA Logo" />
          </a>

          <label
            for="menu-toggle"
            class="material-symbols-outlined"
            >menu</label
          >
        </div>

        <div class="nav-links">
            <a class="link-pagina" href="../painel.html">Painel</a>
            <a class="link-pagina" href="../empresa/lista.html">Empresas</a>
            <a class="link-pagina" href="../cooperativa/lista.html">Cooperativas</a>
            <a class="link-pagina" href="../area/lista.html">Áreas</a>
            <a class="link-pagina" href="../ocorrencia/lista.html">Ocorrências</a>
            <a class="link-pagina" href="../coleta/lista.html">Coletas</a>
            <a class="link-pagina" href="../usuario/lista.html">Usuários</a>
            <a class="link-pagina" href="../perfil/lista.html">Perfis de acesso</a>
            <a class="link-pagina" href="../tipo-residuo/lista.html">Tipos de resíduo</a>
          <span class="usuario-logado">Nome do usuário</span>
          <form class="form-sair" method="get" action="../area-restrita.html">
            <button type="submit" class="btn-sair">Sair</button>
          </form>
        </div>
      </div>
    </nav>

    <main class="container formulario">
        <h1>Novo tipo de resíduo</h1>
        <form method="post" action="../tipo-residuo">
            <input type="hidden" name="action" value="insert">
            <input type="hidden" name="id" value="">

            <label for="category">Categoria</label>
            <input type="text" id="category" name="category" maxlength="100" required>
            <label for="description">Descrição</label>
            <input type="text" id="description" name="description" maxlength="255">
            <label for="defaultRisk">Risco padrão</label>
            <select id="defaultRisk" name="defaultRisk" required>
                <option value="" disabled selected>Selecione</option>
                <option value="BAIXO">BAIXO</option>
                <option value="MEDIO">MEDIO</option>
                <option value="ALTO">ALTO</option>
            </select>

            <div class="botoes">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn btn-secundario" href="lista.html">Cancelar</a>
            </div>
        </form>
    </main>

</body>
</html>
